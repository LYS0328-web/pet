<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>步米 BUMi</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft JhengHei", sans-serif;
}

body{
    background:#d9c6ae;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background-image:
    linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);

    background-size:20px 20px;
}

/* ⭐ 改成直式長方形 */
.container{
    width:100%;
    max-width:420px;
    min-height:700px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;

    padding:40px 20px;

    background:#ecd8bf;

    border:6px solid #4d3b2f;

    box-shadow:8px 8px 0 #8d715a;
}

/* 標題 */
.title-cn{
    font-size:64px;
    font-weight:bold;
    margin-bottom:10px;
    color:#4d3b2f;
    text-shadow:4px 4px 0 #b69472;
}

.title-en{
    font-size:48px;
    font-weight:bold;
    margin-bottom:40px;
    color:#7a5a45;
    text-shadow:3px 3px 0 #c8a98b;
}

/* ⭐ 像素狗（已調整間距） */
.pixel-dog{
    position:relative;
    width:16px;
    height:16px;

    transform:scale(12);
    image-rendering:pixelated;

    margin:40px 0 90px 0;
}

.pixel-dog::before{
    content:"";
    position:absolute;
    width:1px;
    height:1px;

    background:#2b2954;

    box-shadow:
    5px 0 #2b2954,
    6px 0 #2b2954,
    9px 0 #2b2954,
    10px 0 #2b2954,

    4px 1px #2b2954,
    5px 1px #d9a06a,
    6px 1px #d9a06a,
    7px 1px #d9a06a,
    8px 1px #d9a06a,
    9px 1px #d9a06a,
    10px 1px #d9a06a,
    11px 1px #2b2954,

    3px 2px #2b2954,
    4px 2px #d9a06a,
    5px 2px #f2c0c0,
    6px 2px #d9a06a,
    7px 2px #d9a06a,
    8px 2px #d9a06a,
    9px 2px #d9a06a,
    10px 2px #f2c0c0,
    11px 2px #d9a06a,
    12px 2px #2b2954,

    3px 3px #2b2954,
    4px 3px #d9a06a,
    5px 3px #d9a06a,
    6px 3px #d9a06a,
    7px 3px #d9a06a,
    8px 3px #d9a06a,
    9px 3px #d9a06a,
    10px 3px #d9a06a,
    11px 3px #d9a06a,
    12px 3px #2b2954,

    2px 4px #2b2954,
    3px 4px #d9a06a,
    4px 4px #d9a06a,
    5px 4px #d9a06a,
    6px 4px #fff6ea,
    7px 4px #d9a06a,
    8px 4px #d9a06a,
    9px 4px #fff6ea,
    10px 4px #d9a06a,
    11px 4px #d9a06a,
    12px 4px #d9a06a,
    13px 4px #2b2954,

    2px 5px #2b2954,
    3px 5px #d9a06a,
    4px 5px #d9a06a,
    5px 5px #2b2954,
    6px 5px #d9a06a,
    7px 5px #d9a06a,
    8px 5px #d9a06a,
    9px 5px #2b2954,
    10px 5px #d9a06a,
    11px 5px #d9a06a,
    12px 5px #d9a06a,
    13px 5px #2b2954,

    2px 6px #2b2954,
    3px 6px #d9a06a,
    4px 6px #fff6ea,
    5px 6px #fff6ea,
    6px 6px #fff6ea,
    7px 6px #2b2954,
    8px 6px #2b2954,
    9px 6px #fff6ea,
    10px 6px #fff6ea,
    11px 6px #fff6ea,
    12px 6px #d9a06a,
    13px 6px #2b2954,

    2px 7px #2b2954,
    3px 7px #d9a06a,
    4px 7px #fff6ea,
    5px 7px #fff6ea,
    6px 7px #2b2954,
    7px 7px #fff6ea,
    8px 7px #fff6ea,
    9px 7px #2b2954,
    10px 7px #fff6ea,
    11px 7px #fff6ea,
    12px 7px #d9a06a,
    13px 7px #2b2954,

    2px 8px #2b2954,
    3px 8px #d9a06a,
    4px 8px #fff6ea,
    5px 8px #fff6ea,
    6px 8px #fff6ea,
    7px 8px #fff6ea,
    8px 8px #fff6ea,
    9px 8px #fff6ea,
    10px 8px #fff6ea,
    11px 8px #fff6ea,
    12px 8px #d9a06a,
    13px 8px #2b2954,

    2px 9px #2b2954,
    3px 9px #d9a06a,
    4px 9px #fff6ea,
    5px 9px #fff6ea,
    6px 9px #fff6ea,
    7px 9px #f0d7c5,
    8px 9px #f0d7c5,
    9px 9px #fff6ea,
    10px 9px #fff6ea,
    11px 9px #fff6ea,
    12px 9px #d9a06a,
    13px 9px #2b2954,

    3px 10px #2b2954,
    4px 10px #d9a06a,
    5px 10px #fff6ea,
    6px 10px #fff6ea,
    7px 10px #fff6ea,
    8px 10px #fff6ea,
    9px 10px #fff6ea,
    10px 10px #fff6ea,
    11px 10px #d9a06a,
    12px 10px #2b2954,

    3px 11px #2b2954,
    4px 11px #d9a06a,

    8px 11px #fff6ea,
    9px 11px #fff6ea,
    10px 11px #d9a06a,
    11px 11px #d9a06a,
    12px 11px #2b2954,

    4px 12px #2b2954,
    5px 12px #d9a06a,
    6px 12px #d9a06a,
    7px 12px #fff6ea,
    8px 12px #fff6ea,
    9px 12px #d9a06a,
    10px 12px #d9a06a,
    11px 12px #2b2954,

    5px 13px #2b2954,
    6px 13px #d9a06a,
    7px 13px #2b2954,
    8px 13px #2b2954,
    9px 13px #d9a06a,
    10px 13px #2b2954;
}

/* 按鈕 */
.buttons{
    width:100%;
    display:flex;
    justify-content:space-between;
    gap:20px;
}

.btn{
    flex:1;
    background:#f6f1e8;
    border:none;
    padding:20px 10px;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    transition:0.15s;
    border:5px solid #4d3b2f;
    box-shadow:0 6px 0 #9b7d62;
    color:#4d3b2f;
}

.btn:hover{
    transform:translateY(2px);
    box-shadow:0 4px 0 #9b7d62;
    background:#fff8ef;
}

.btn:last-child{
    background:#d7ead7;
}

/* 手機 */
@media(max-width:600px){
    .container{width:92%; padding:30px 15px;}
    .title-cn{font-size:48px;}
    .title-en{font-size:36px;}
    .buttons{flex-direction:column;}
    .btn{width:100%; font-size:22px;}
    .pixel-dog{transform:scale(8); margin:30px 0 60px 0;}
}

</style>
</head>

<body>

<div class="container">

    <div class="title-cn">步米</div>
    <div class="title-en">BUMi</div>

    <!-- 像素狗 -->
    <div class="pixel-dog"></div>

    <div class="buttons">
        <button class="btn">出發</button>
        <button class="btn">觀看歷史紀錄</button>
    </div>

</div>

</body>
</html>
